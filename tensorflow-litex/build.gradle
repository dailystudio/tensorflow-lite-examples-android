plugins {
    id 'com.android.library'

    id("com.google.devtools.ksp") version "$ksp_version"
    id("cn.dailystudio.devbricksx.devkit") version "$devkit_version"
}

android {
    namespace 'com.dailystudio.tensorflow.litex'

    buildFeatures {
        buildConfig = true
    }

    compileSdkVersion COMPILE_SDK
    buildToolsVersion BUILD_TOOLS

    defaultConfig {
        minSdkVersion MIN_SDK
        targetSdkVersion TARGET_SDK
        versionCode VERSION_CODE
        versionName VERSION_NAME

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            buildConfigField "boolean","USE_STETHO","false"
        }

        debug {
            debuggable true

            buildConfigField "boolean","USE_STETHO","true"
        }
    }
}


devKit {
    devKitComps.set([
        'Camera',
        'Audio'
    ])
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Build off of nightly TensorFlow Lite
    api("com.google.ai.edge.litert:litert:${project.ext.tfliteVersion}") { changing = true }
    api("com.google.ai.edge.litert:litert-gpu:${project.ext.tfliteGpuVersion}") { changing = true }
    api("com.google.ai.edge.litert:litert-gpu-api:${project.ext.tfliteGpuVersion}") { changing = true }
    api("com.google.ai.edge.litert:litert-support:${project.ext.tfliteSupportVersion}") { changing = true }
    api("com.google.ai.edge.litert:litert-support-api:${project.ext.tfliteSupportVersion}") { changing = true }
    api("com.google.ai.edge.litert:litert-metadata:${project.ext.tfliteMetadataVersion}") { changing = true }

    // Test helpers
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    testImplementation "androidx.room:room-testing:${ROOM_VERSION}"
}

apply from: '../buildscripts/maven_push.gradle'